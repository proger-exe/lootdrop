[build-system]
requires = ["poetry-core>=1.8,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lootdrop"
version = "0.1.0"
description = "Telegram commerce bot for manual digital goods fulfillment."
authors = ["LootDrop"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "3.30.0"
raito = "1.4.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
structlog = "^24.4.0"
orjson = "^3.10.0"
tenacity = "^9.0.0"
cryptography = "^44.0.0"
qrcode = { version = "^8.0", extras = ["pil"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.14.0"
black = "^25.0.0"
mypy = "^1.19.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "DTZ"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
